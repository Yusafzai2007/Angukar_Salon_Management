<div class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-sm border border-gray-200 w-full max-w-2xl p-8 md:p-12">
    <h1 class="text-3xl font-semibold text-gray-900 text-center mb-2">
      {{ isEditMode ? 'Edit User' : 'Add New User' }}
    </h1>
    <p class="text-base text-gray-500 text-center mb-8">
      {{
        isEditMode
          ? 'Update the user details below.'
          : 'Please fill out the details below to add a new user.'
      }}
    </p>

    <form class="space-y-6" (ngSubmit)="onsubmit()" #userForm="ngForm">
      <!-- Username & Email -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="relative w-full">
          <input
            [(ngModel)]="addusers.userName"
            name="userName"
            placeholder=" "
            required
            class="peer block w-full px-7 pt-3 pb-4 text-sm border border-slate-400 rounded-sm focus:ring-1 focus:ring-indigo-400"
          />
          <label class="floating-label">Username *</label>
        </div>

        <div class="relative w-full">
          <input
            [(ngModel)]="addusers.email"
            name="email"
            type="email"
            placeholder=" "
            required
            class="peer block w-full px-7 pt-3 pb-4 text-sm border border-slate-400 rounded-sm focus:ring-1 focus:ring-indigo-400"
          />
          <label class="floating-label">Email *</label>
        </div>
      </div>

      <!-- Role Field -->
      <div class="relative w-full">
        <select
          [(ngModel)]="addusers.role"
          name="role"
          required
          class="peer block w-full px-7 pt-3 pb-4 text-sm border border-slate-400 rounded-sm focus:ring-1 focus:ring-indigo-400"
        >
          <option value="">Select Role</option>
          <option value="admin">Admin</option>
          <option value="customer">Customer</option>
          <option value="staff">Staff</option>
        </select>
        <label class="floating-label">Role *</label>
      </div>

      <div class="flex gap-3">
        <button
          type="button"
          (click)="setStatus('active')"
          [class.bg-green-50]="addusers.status === 'active'"
          [class.text-green-600]="addusers.status === 'active'"
          class="px-6 py-2 rounded-full border"
        >
          Active
        </button>

        <button
          type="button"
          (click)="setStatus('inactive')"
          [class.bg-red-50]="addusers.status === 'inactive'"
          [class.text-red-600]="addusers.status === 'inactive'"
          class="px-6 py-2 rounded-full border"
        >
          Deactivate
        </button>
      </div>

      <!-- Buttons -->
      <div class="flex justify-end gap-3 pt-4">
        <button
          routerLink="/user"
          type="button"
          class="px-6 py-2.5 border border-gray-300 rounded-md text-sm text-gray-700 hover:bg-gray-50 transition-colors"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="userForm.invalid"
          class="px-6 py-2.5 bg-indigo-600 text-white rounded-md text-sm hover:bg-indigo-700 transition-colors disabled:bg-indigo-300"
        >
          {{ isEditMode ? 'Update User' : 'Create User' }}
        </button>
      </div>
    </form>
  </div>
</div>
