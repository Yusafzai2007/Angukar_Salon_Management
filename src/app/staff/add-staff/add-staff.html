<div class="mt-36">
  <form
    (ngSubmit)="createStaff()"
    #staffForm="ngForm"
    class="max-w-2xl mx-auto mt-10 bg-white shadow-lg grid grid-cols-2 gap-5 rounded-2xl p-6"
  >
    <!-- Search User Dropdown -->
    <div class="relative w-full">
      <input
        type="text"
        [(ngModel)]="searchText"
        name="searchText"
        (focus)="dropdownOpen = true"
        (input)="filterUsers()"
        (blur)="closeDropdown()"
        placeholder=" "
        class="peer block w-full px-4 pt-5 pb-2 text-sm text-slate-900 bg-white border border-slate-200 rounded-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"
        autocomplete="off"
      />
      <label
        class="absolute left-3 bg-white px-1 text-slate-700 pointer-events-none top-1/2 -translate-y-1/2 text-md transition-all duration-200 peer-focus:top-1 peer-focus:-translate-y-3 peer-focus:text-sm peer-focus:text-indigo-400 peer-[&:not(:placeholder-shown)]:top-1 peer-[&:not(:placeholder-shown)]:-translate-y-3 peer-[&:not(:placeholder-shown)]:text-sm"
      >
        Search User <span class="text-red-500">*</span>
      </label>

      <!-- Dropdown -->
      <div
        *ngIf="dropdownOpen && filteredUsers.length > 0"
        class="absolute z-10 w-full bg-white border border-gray-300 rounded-lg mt-1 max-h-40 overflow-y-auto shadow-sm"
      >
        <div
          *ngFor="let user of filteredUsers"
          (click)="selectUser(user)"
          class="px-4 py-2 hover:bg-indigo-100 cursor-pointer text-sm transition duration-150"
        >
          {{ user.userName }}
        </div>
      </div>

      <!-- No results message -->
      <div
        *ngIf="dropdownOpen && filteredUsers.length === 0 && searchText"
        class="absolute z-10 w-full bg-white border border-gray-300 rounded-lg mt-1 p-4 text-center text-gray-500"
      >
        No users found
      </div>
    </div>

    <!-- Phone Number -->
    <div class="relative w-full">
      <input
        type="tel"
        id="phone_floating"
        [(ngModel)]="staffData.phone_number"
        name="phone_number"
        required
        placeholder=" "
        class="peer block w-full px-4 pt-5 pb-2 text-sm text-gray-800 bg-white border border-gray-300 rounded-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"
      />
      <label
        for="phone_floating"
        class="absolute left-3 bg-white px-1 text-gray-600 pointer-events-none top-1/2 -translate-y-1/2 text-sm transition-all duration-200 peer-focus:top-1 peer-focus:-translate-y-3 peer-focus:text-xs peer-focus:text-indigo-500 peer-[&:not(:placeholder-shown)]:top-1 peer-[&:not(:placeholder-shown)]:-translate-y-3 peer-[&:not(:placeholder-shown)]:text-xs"
      >
        Phone Number <span class="text-red-500">*</span>
      </label>
    </div>

    <!-- Experience -->
    <div class="relative w-full">
      <input
        type="number"
        id="experience_floating"
        [(ngModel)]="staffData.experience"
        name="experience"
        required
        min="0"
        step="0.5"
        placeholder=" "
        class="peer block w-full px-4 pt-5 pb-2 text-sm text-gray-800 bg-white border border-gray-300 rounded-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"
      />
      <label
        for="experience_floating"
        class="absolute left-3 bg-white px-1 text-gray-600 pointer-events-none top-1/2 -translate-y-1/2 text-sm transition-all duration-200 peer-focus:top-1 peer-focus:-translate-y-3 peer-focus:text-xs peer-focus:text-indigo-500 peer-[&:not(:placeholder-shown)]:top-1 peer-[&:not(:placeholder-shown)]:-translate-y-3 peer-[&:not(:placeholder-shown)]:text-xs"
      >
        Experience (years) <span class="text-red-500">*</span>
      </label>
    </div>

    <!-- Address -->
    <div class="relative w-full">
      <input
        type="text"
        id="address_floating"
        [(ngModel)]="staffData.address"
        name="address"
        required
        placeholder=" "
        class="peer block w-full px-4 pt-5 pb-2 text-sm text-gray-800 bg-white border border-gray-300 rounded-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"
      />
      <label
        for="address_floating"
        class="absolute left-3 bg-white px-1 text-gray-600 pointer-events-none top-1/2 -translate-y-1/2 text-sm transition-all duration-200 peer-focus:top-1 peer-focus:-translate-y-3 peer-focus:text-xs peer-focus:text-indigo-500 peer-[&:not(:placeholder-shown)]:top-1 peer-[&:not(:placeholder-shown)]:-translate-y-3 peer-[&:not(:placeholder-shown)]:text-xs"
      >
        Address <span class="text-red-500">*</span>
      </label>
    </div>

    <!-- Service Multi-Select Dropdown -->
    <div class="relative w-full col-span-2">
      <div class="relative">
        <input
          type="text"
          [(ngModel)]="serviceSearchText"
          name="serviceSearchText"
          (focus)="toggleServiceDropdown()"
          (input)="filterServices()"
          (blur)="closeServiceDropdown()"
          placeholder=" "
          class="peer block w-full px-4 pt-5 pb-2 text-sm text-slate-900 bg-white border border-slate-200 rounded-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"
          autocomplete="off"
        />
        <label
          class="absolute left-3 bg-white px-1 text-slate-700 pointer-events-none top-1/2 -translate-y-1/2 text-md transition-all duration-200 peer-focus:top-1 peer-focus:-translate-y-3 peer-focus:text-sm peer-focus:text-indigo-400 peer-[&:not(:placeholder-shown)]:top-1 peer-[&:not(:placeholder-shown)]:-translate-y-3 peer-[&:not(:placeholder-shown)]:text-sm"
        >
          Search & Select Services <span class="text-red-500">*</span>
        </label>

        <!-- Dropdown -->
        <div
          *ngIf="serviceDropdownOpen && filteredServices.length > 0"
          class="absolute z-10 w-full bg-white border border-gray-300 rounded-lg mt-1 max-h-40 overflow-y-auto shadow-sm"
        >
          <div
            *ngFor="let service of filteredServices"
            (click)="selectService(service)"
            class="px-4 py-2 hover:bg-indigo-100 cursor-pointer text-sm transition duration-150"
          >
            <div class="flex justify-between items-center">
              <span>{{ service.Service_Name }}</span>
              <span class="text-xs text-gray-500">₹{{ service.final_price }}</span>
            </div>
          </div>
        </div>

        <!-- No results message -->
        <div
          *ngIf="serviceDropdownOpen && filteredServices.length === 0 && serviceSearchText"
          class="absolute z-10 w-full bg-white border border-gray-300 rounded-lg mt-1 p-4 text-center text-gray-500"
        >
          No services found
        </div>
      </div>

      <!-- Selected Services Tags -->
      <div *ngIf="selectedServices.length > 0" class="mt-3 flex flex-wrap gap-2">
        <div
          *ngFor="let service of selectedServices"
          class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-sm flex items-center gap-2"
        >
          <span>{{ service.Service_Name }}</span>
          <span class="text-xs font-semibold">(₹{{ service.final_price }})</span>
          <button
            type="button"
            (click)="removeService(service)"
            class="ml-1 text-indigo-600 hover:text-indigo-800 focus:outline-none"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>
      
      <!-- Hint text -->
      <p class="text-xs text-gray-500 mt-1">Click on services to select multiple services</p>
    </div>

    <!-- Description (Full Width) -->
    <div class="relative col-span-2 w-full">
      <textarea
        id="description_floating"
        [(ngModel)]="staffData.description"
        name="description"
        rows="4"
        required
        placeholder=" "
        class="peer block w-full px-4 pt-6 pb-2 text-sm text-gray-800 bg-white border border-gray-300 rounded-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"
      ></textarea>
      <label
        for="description_floating"
        class="absolute left-3 bg-white px-1 text-gray-600 pointer-events-none top-5 text-sm transition-all duration-200 peer-focus:top-2 peer-focus:text-xs peer-focus:text-indigo-500 peer-[&:not(:placeholder-shown)]:top-2 peer-[&:not(:placeholder-shown)]:text-xs"
      >
        Description <span class="text-red-500">*</span>
      </label>
    </div>

    <!-- Submit Button -->
    <div class="col-span-2">
      <button
        type="submit"
        [disabled]="
          !staffData.userName ||
          !staffData.phone_number ||
          !staffData.experience ||
          !staffData.address ||
          !staffData.description ||
          !staffData.Service_Name.length
        "
        class="w-full bg-slate-800 text-white py-2 rounded-lg hover:bg-slate-900 transition duration-300 disabled:bg-gray-400 disabled:cursor-not-allowed"
      >
        Create Staff
      </button>
    </div>
  </form>
</div>
